<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Directory Scan</title>
</head>
<body>
    <form action="#" method="post">
        <label for="scanFor">Scan for:</label>
        <select id="scanFor" name="scanFor">
            <option value="activeDirectory">Active Directory</option>
        </select>
        <br><br>

        <label for="fqdn">Fully-qualified domain name:</label>
        <input type="text" id="fqdn" name="fqdn">
        <br><br>

        <label for="ou">Organizational Unit:</label>
        <input type="text" id="ou" name="ou">
        <br><br>

        <label for="domainController">Domain controller:</label>
        <input type="text" id="domainController" name="domainController">
        <br><br>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <button type="submit">Add to Scan</button>
        <button type="reset">Exclude from Scan</button>
    </form>
</body>
</html>
